<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaaS Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <aside class="sidebar">
            <h2>Dashboard</h2>
            <nav>
                <a href="#">Home</a>
                <a href="#">Users</a>
                <a href="#">Analytics</a>
                <a href="#">Settings</a>
            </nav>
        </aside>

        <header class="header">
            <input type="text" placeholder="Search">
        </header>

        <main class="Main Content">
            <div class="cards">

                <div class="card">
                    <h3>Total Users</h3>
                    <p>1,240</p>
                </div>

                <div class="card">
                    <h3>Revenue</h3>
                    <p>$12,000</p>
                </div>

                <div class="card">
                    <h3>Sales</h3>
                    <p>320</p>
                </div>

                <div class="card">
                    <h3>Active Users</h3>
                    <p>860</p>
                </div>

            </div>
        </main>
    </div>
</body>
</html>
